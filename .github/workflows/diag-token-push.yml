name: Diagnostic Token Push

# Throwaway diagnostic: pushes a trivial commit to a new branch using the
# default GITHUB_TOKEN, to test whether a branch touched by that identity
# behaves differently for pull_request event dispatch than a branch touched
# only by a human. Delete once the investigation is done.

on:
  workflow_dispatch:
    inputs:
      branch_name:
        required: true
        type: string

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      # Step 1: checkout the NEW branch with the default token (mirrors
      # new-module.yml's first checkout), commit+push via GITHUB_TOKEN.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          git checkout -b "${{ inputs.branch_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "first commit (GITHUB_TOKEN)" > diag-step1.txt
          git add diag-step1.txt
          git commit -m "diagnostic: first commit via GITHUB_TOKEN"
          git push origin "${{ inputs.branch_name }}"

      # Step 2: checkout main with the PAT (mirrors new-module.yml's
      # "Checkout main" step), commit+push to main via the PAT.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GELS_SANDBOX_PAT }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "main touch $(date +%s)" > diag-main-touch.txt
          git add diag-main-touch.txt
          git commit -m "diagnostic: touch main via PAT"
          git push origin HEAD:main

      # Step 3: switch BACK to the new branch using a plain git checkout (no
      # actions/checkout call) -- this reuses whatever credentials are still
      # configured from step 2's PAT-authenticated checkout, exactly like
      # new-module.yml's "Sync main's registration back" step does. Commit +
      # push a SECOND commit onto the SAME branch, this time via the PAT.
      - run: |
          git checkout -B "${{ inputs.branch_name }}" "origin/${{ inputs.branch_name }}"
          echo "second commit (PAT, after touching main)" > diag-step3.txt
          git add diag-step3.txt
          git commit -m "diagnostic: second commit via PAT after touching main"
          git push origin "HEAD:${{ inputs.branch_name }}"
