name: Diagnostic Merge Trigger

# Throwaway diagnostic: no condition at all, just logs the raw event payload
# fields on every pull_request closed event, to test whether a genuine merge
# (as opposed to a close-without-merge) reaches Actions at all for this repo.
# Delete once the investigation is done.

on:
  pull_request:
    types: [closed]

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "merged=${{ github.event.pull_request.merged }}"
          echo "base=${{ github.event.pull_request.base.ref }}"
          echo "head=${{ github.event.pull_request.head.ref }}"
          echo "number=${{ github.event.pull_request.number }}"
