name: Module Promotion

# Implements the "Update Functional Module to Medical" path of the GeLS workflow.
# Pushing a branch named  promotion/<INDEX_NAME>  (e.g.
# promotion/PM_02_47_MOTOR_DRIVER_BTM9011EP) moves the module from
# functional/AppModules/ back into development/AppModules/ (history preserved via
# git mv) so it can go through the full IEC 62304 development process. The change
# is committed back onto the same promotion/* branch.
#
# From there the developer completes the IEC 62304 work, opens a PR with the
# IEC 62304 template/label, and on merge the Module Folder Promotion workflow
# moves it on to certified/.

on:
  push:
    branches:
      - 'promotion/**'

permissions:
  contents: write

concurrency:
  group: module-promotion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    # Skip runs triggered by this workflow's own commit (authored as
    # github-actions[bot]). Mirrors the guard in new-module.yml and keeps the
    # move commit free of `[skip ci]`, so it can never suppress a later
    # pull_request merge event of the promotion/* branch.
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve promotion move
        id: resolve
        run: python .github/scripts/resolve_promotion.py "${{ github.ref_name }}"

      - name: Move module folder & push
        if: steps.resolve.outputs.move == 'true'
        env:
          SRC: ${{ steps.resolve.outputs.src }}
          DEST: ${{ steps.resolve.outputs.dest }}
          MODULE: ${{ steps.resolve.outputs.module }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$(dirname "$DEST")"
          git mv "$SRC" "$DEST"
          git commit -m "promote: move $MODULE from functional/ to development/"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "Moved $MODULE to development/ for IEC 62304 promotion."
