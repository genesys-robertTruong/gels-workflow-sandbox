name: New Module Scaffold

# Implements the "New module" path of the GeLS module workflow: pushing a
# branch named  development/<INDEX_NAME>  (e.g.
# development/PM_02_47_MOTOR_DRIVER_BTM9011EP) makes this action:
#
#   1. Scaffold the module under development/AppModules/ from template/ and
#      commit it onto that same branch.
#   2. Register the module directly on main (see register_module.py for why
#      that happens immediately, on main, rather than waiting for a future
#      PR), then sync that registration back onto the development branch so
#      it stays buildable.
#
# A push to development/<INDEX_NAME> is the single entry point for getting a
# module into development, whatever its current state -- the source is inferred:
#
#   * deferred/AppModules/ on deferred/snapshot -> restore_from_deferred.py
#     moves it back and clears the deferred copy (resume a parked module).
#   * functional/AppModules/ (inherited from main) -> regrade_from_functional.py
#     git-moves it into development/ for a full IEC 62304 re-grade. This
#     replaces the old promotion/<INDEX_NAME> branch + module-promotion.yml.
#   * nowhere yet -> scaffold_module.py creates it from template/.
#
# A module is only ever in one of those states, so the choice is unambiguous.
# In the resume and re-grade cases the module is already registered on main, so
# the register step below is a no-op.
#
# IMPORTANT: registering on main pushes a commit directly to the protected
# default branch, which the built-in GITHUB_TOKEN is never allowed to do.
#
# SANDBOX VARIANT: uses the GELS_SANDBOX_PAT secret instead of a GitHub App --
# see module-folder-move.yml for why.

on:
  push:
    branches:
      - 'development/**'

permissions:
  contents: write

concurrency:
  # Never run two scaffolds for the same branch at once.
  group: new-module-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scaffold:
    runs-on: ubuntu-latest
    # Skip runs triggered by this workflow's own pushes. Its scaffold /
    # register / sync-back / resume commits are all authored as
    # github-actions[bot], so this guard stops the PAT-authenticated sync-back
    # push from re-running the scaffold. This replaces the old `[skip ci]`
    # markers, which GitHub also honoured on the *pull_request* events of any
    # later defer or promotion merge of this branch -- silently suppressing
    # defer-module-cleanup and module-folder-move. The guard is scoped to this
    # push-triggered workflow and does not affect those merge events.
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore from deferred/snapshot, if previously deferred
        id: restore
        run: python .github/scripts/restore_from_deferred.py "${{ github.ref_name }}"

      - name: Re-grade from functional/, if applicable
        id: regrade
        run: python .github/scripts/regrade_from_functional.py "${{ github.ref_name }}"

      - name: Scaffold module files from template
        id: scaffold
        run: python .github/scripts/scaffold_module.py "${{ github.ref_name }}"

      - name: Commit & push generated module files
        if: >
          steps.scaffold.outputs.changed == 'true' ||
          steps.restore.outputs.restored == 'true' ||
          steps.regrade.outputs.regraded == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          MODULE="${{ steps.scaffold.outputs.module || steps.restore.outputs.module || steps.regrade.outputs.module }}"
          if [ "${{ steps.restore.outputs.restored }}" = "true" ]; then
            git commit -m "resume: restore module $MODULE from deferred/"
          elif [ "${{ steps.regrade.outputs.regraded }}" = "true" ]; then
            git commit -m "regrade: move module $MODULE from functional/ to development/"
          else
            git commit -m "scaffold: add module $MODULE files"
          fi
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Remove module from deferred/snapshot
        if: steps.restore.outputs.restored == 'true'
        env:
          MODULE: ${{ steps.restore.outputs.module }}
        run: |
          git checkout -B deferred/snapshot origin/deferred/snapshot
          git rm -r "deferred/AppModules/$MODULE"
          git commit -m "resume: remove $MODULE from deferred (moved to development/)"
          git push origin deferred/snapshot

      - name: Require the sandbox PAT
        env:
          SANDBOX_PAT: ${{ secrets.GELS_SANDBOX_PAT }}
        run: |
          if [ -z "$SANDBOX_PAT" ]; then
            echo "::error::GELS_SANDBOX_PAT is not set. This workflow registers the module" \
                 "directly on main, which requires pushing to that protected branch. Add" \
                 "the secret and put it on the ruleset bypass list, then re-run this job --" \
                 "the module's files are on this branch but it is not yet registered."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GELS_SANDBOX_PAT }}

      - name: Set up Python (main checkout)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Register module on main
        id: register
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            python .github/scripts/register_module.py "$BRANCH"
            git add -A
            if git diff --cached --quiet; then
              echo "Already registered on main; nothing to push."
              break
            fi
            git commit -m "register: add module to AppModules.h/.c"
            if git push origin HEAD:main; then
              echo "Registered on main."
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::Could not register on main after 5 attempts. The module's" \
                   "files are on the development branch but it is NOT YET registered in" \
                   "AppModules.h/.c. Most likely GELS_SANDBOX_PAT is not on main's ruleset" \
                   "bypass list, or there is heavy concurrent scaffold activity. Fix and" \
                   "re-run this job."
              exit 1
            fi
            echo "::warning::Push attempt $attempt failed (concurrent registration?);" \
                 "refetching main and recomputing the index."
            git reset --hard HEAD~1
            git fetch origin main
            git reset --hard origin/main
          done

      - name: Sync main's registration back onto the development branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git checkout main -- exempt/AppModules/AppModules/AppModules.h exempt/AppModules/AppModules/AppModules.c
          git add exempt/AppModules/AppModules/AppModules.h exempt/AppModules/AppModules/AppModules.c
          if git diff --cached --quiet; then
            echo "Development branch already matches main's registration."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "register: sync AppModules.h/.c from main"
          git push origin "HEAD:$BRANCH"
